  :root {
    /* charte La Rosière — relevée sur larosiere.net */
    --plum:      #310C25;   /* « bordeaux » dans leur nommage : encre et bandeaux */
    --plum-text: #3E1832;   /* texte courant */
    --rose:      #E71B7B;
    --rose-deep: #BB1663;
    --bleu:      #2EAEDD;
    --jaune:     #D8B900;

    --paper:   #FFFFFF;
    --paper-2: #FBF7F9;   /* blanc teinté prune, jamais un gris neutre */
    --paper-3: #F4ECF0;
    --rule:    #EADFE5;
    --rule-2:  #D8C4CF;
    --ink:     #310C25;
    --ink-2:   #6B4A5D;
    --ink-3:   #7F6574;   /* RGAA : 5,2:1 sur blanc et 4,5:1 sur paper-3 */

    --ok:      #0E7053;
    --ok-bg:   #E4F2EC;
    --wait:    #876A00;   /* RGAA : 4,6:1 sur wait-bg */
    --wait-bg: #FBF3D4;
    --stop:    #C0102C;
    --stop-bg: #FBE7EA;
    --info:    #14748F;
    --info-bg: #E2F4FA;

    --r: 3px;                       /* leur rayon de formulaire, repris tel quel */
    --sans: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
    --shell: 1180px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:   #1A0A13;
      --paper-2: #23101A;
      --paper-3: #2E1724;
      --rule:    #3B2130;
      --rule-2:  #55344A;
      --ink:     #F7EDF2;
      --ink-2:   #C3A6B5;
      --ink-3:   #977C8B;
      --plum-text: #F7EDF2;
      --rose:    #F76BA6;
      --rose-deep: #E71B7B;
      --ok:      #4FBF95; --ok-bg:   #103024;
      --wait:    #E0C24C; --wait-bg: #322914;
      --stop:    #F2808F; --stop-bg: #38161C;
      --info:    #6ACBE8; --info-bg: #12303A;
    }
  }
  :root[data-theme="dark"] {
    --paper:#1A0A13; --paper-2:#23101A; --paper-3:#2E1724;
    --rule:#3B2130; --rule-2:#55344A;
    --ink:#F7EDF2; --ink-2:#C3A6B5; --ink-3:#977C8B; --plum-text:#F7EDF2;
    --rose:#F76BA6; --rose-deep:#E71B7B;
    --ok:#4FBF95; --ok-bg:#103024;
    --wait:#E0C24C; --wait-bg:#322914;
    --stop:#F2808F; --stop-bg:#38161C;
    --info:#6ACBE8; --info-bg:#12303A;
  }
  :root[data-theme="light"] {
    --paper:#FFFFFF; --paper-2:#FBF7F9; --paper-3:#F4ECF0;
    --rule:#EADFE5; --rule-2:#D8C4CF;
    --ink:#310C25; --ink-2:#6B4A5D; --ink-3:#7F6574; --plum-text:#3E1832;
    --rose:#E71B7B; --rose-deep:#BB1663;
    --ok:#0E7053; --ok-bg:#E4F2EC;
    --wait:#876A00; --wait-bg:#FBF3D4;
    --stop:#C0102C; --stop-bg:#FBE7EA;
    --info:#14748F; --info-bg:#E2F4FA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--plum-text);
    font-family: var(--sans);
    font-weight: 350;
    font-size: 15.5px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { margin: 0; color: var(--ink); text-wrap: balance; }
  h1 { font-weight: 300; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.08; letter-spacing: -.022em; }
  h2 { font-weight: 600; font-size: 15px; letter-spacing: .005em; }
  h3 { font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
  p { margin: 0; }
  a { color: var(--rose-deep); }

  .lede { font-size: 17px; font-weight: 300; line-height: 1.5; color: var(--ink-2); max-width: 58ch; }
  .small { font-size: 13px; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }

  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

  /* ---------------------------------------------------------- avis démo */
  .notice {
    background: var(--jaune);
    color: #2A0A1F;
    font-size: 12.5px;
    font-weight: 350;
    line-height: 1.4;
    padding: 6px 22px;
  }
  .notice .in { max-width: var(--shell); margin: 0 auto; display: flex; gap: 9px 14px; align-items: center; flex-wrap: wrap; }
  .notice b { font-weight: 700; letter-spacing: .07em; text-transform: uppercase; font-size: 10.5px; flex: none; }
  .notice .push { flex: 1 1 20px; }
  .notice .as { display: flex; align-items: center; gap: 8px; }
  .notice .as > span { font-size: 11.5px; opacity: .8; }
  .notice .as .grp { display: flex; border: 1px solid rgba(42,10,31,.3); border-radius: var(--r); overflow: hidden; }
  .notice .as button {
    border: 0; background: transparent; font-family: inherit; font-size: 11.5px; font-weight: 400;
    color: #2A0A1F; padding: 3px 10px; cursor: pointer; transition: background .15s, color .15s;
  }
  .notice .as button + button { border-left: 1px solid rgba(42,10,31,.3); }
  .notice .as button:hover { background: rgba(42,10,31,.1); }
  .notice .as button[aria-pressed="true"] { background: var(--plum); color: #fff; }
  .notice .lnk {
    border: 0; background: none; font-family: inherit; font-size: 12px; color: #2A0A1F;
    text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 0; flex: none;
  }

  /* ------------------------------------------------------------ bandeau */
  .masthead { background: var(--plum); color: #fff; position: relative; overflow: hidden; }
  .masthead .ridge { position: absolute; right: 0; bottom: -1px; width: min(46%, 520px); opacity: .16; pointer-events: none; }
  .masthead .inner {
    max-width: var(--shell); margin: 0 auto; padding: 20px 22px 0;
    position: relative; z-index: 1;
    display: flex; flex-direction: column; gap: 16px;
  }
  .masthead .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; }

  .wordmark { display: flex; gap: 13px; align-items: center; }
  .wordmark .glyph { flex: none; }
  .wordmark .txt { display: flex; flex-direction: column; line-height: 1.15; }
  .wordmark .l1 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  .wordmark .l2 { font-size: 12.5px; font-weight: 300; color: #E9C9DA; letter-spacing: .02em; }

  .whoami { display: flex; gap: 14px; align-items: center; }
  .whoami .name { font-size: 13.5px; font-weight: 400; color: #F3DDE9; }
  .whoami .name em { font-style: normal; color: #DDBACD; }
  .whoami .act {
    border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 400; padding: 5px 13px; border-radius: var(--r);
    transition: background .16s, border-color .16s;
  }
  .whoami .act:hover { background: rgba(255,255,255,.12); border-color: #fff; }
  .whoami .act.solid { background: var(--rose); border-color: var(--rose); font-weight: 500; }
  .whoami .act.solid:hover { background: var(--rose-deep); border-color: var(--rose-deep); }

  .tabs { display: flex; gap: 26px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    border: 0; background: transparent; cursor: pointer; white-space: nowrap;
    color: #DDBACD; font-size: 14px; font-weight: 350; padding: 0 0 13px;
    border-bottom: 3px solid transparent; transition: color .16s, border-color .16s;
    display: flex; align-items: center; gap: 7px;
  }
  .tabs button:hover { color: #fff; }
  .tabs button[aria-current="page"] { color: #fff; font-weight: 500; border-bottom-color: var(--rose); }
  .tabs .badge {
    background: var(--rose); color: #fff; font-size: 11px; font-weight: 600;
    border-radius: 20px; padding: 0 6px; min-width: 18px; text-align: center;
  }

  /* -------------------------------------------------------------- corps */
  main { max-width: var(--shell); margin: 0 auto; padding: 40px 22px 90px; }
  .head { margin-bottom: 34px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  .head .lede { margin-top: 12px; }

  .section { margin-top: 44px; }
  .section > .bar {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding-bottom: 11px; border-bottom: 2px solid var(--ink); margin-bottom: 2px;
  }
  .section > .bar .count { font-size: 13px; color: var(--ink-3); }

  .rows > * { border-bottom: 1px solid var(--rule); }
  .row {
    display: flex; align-items: center; gap: 18px;
    padding: 15px 4px; transition: background .14s;
  }
  .row:hover { background: var(--paper-2); }
  .row .grow { flex: 1; min-width: 0; }
  .row .title { font-weight: 500; font-size: 15.5px; color: var(--ink); }
  .row .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }

  /* chiffres en tête — filets verticaux, pas des cartes */
  .figures { display: flex; flex-wrap: wrap; border-top: 2px solid var(--ink); }
  .figures > div { flex: 1 1 190px; padding: 18px 22px 18px 0; }
  .figures > div + div { border-left: 1px solid var(--rule); padding-left: 22px; }
  .figures .val { font-size: 38px; font-weight: 200; letter-spacing: -.03em; color: var(--ink); line-height: 1.05; }
  .figures .val.word { font-size: 25px; font-weight: 300; }
  .figures .cap { font-size: 12.5px; color: var(--ink-3); margin-top: 5px; }
  .figures .cap b { font-weight: 500; color: var(--ink-2); }

  .tag {
    display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px;
    border-radius: var(--r); white-space: nowrap; letter-spacing: .005em;
  }
  .t-ok   { background: var(--ok-bg);   color: var(--ok); }
  .t-wait { background: var(--wait-bg); color: var(--wait); }
  .t-stop { background: var(--stop-bg); color: var(--stop); }
  .t-idle { background: var(--paper-3); color: var(--ink-3); }
  .t-info { background: var(--info-bg); color: var(--info); }

  .btn {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-size: 14px; font-weight: 500; padding: 9px 17px;
    border-radius: var(--r); border: 1px solid transparent;
    transition: background .16s, border-color .16s, color .16s;
  }
  /* RGAA : blanc sur rose vif = 4.34:1, insuffisant. Le rose foncé donne 6.16:1. */
  .btn-1 { background: var(--rose-deep); color: #fff; }
  .btn-1:hover { background: #96114F; }
  .btn-2 { background: transparent; border-color: var(--rule-2); color: var(--ink); }
  .btn-2:hover { border-color: var(--ink); }
  .btn-ok { background: transparent; border-color: var(--ok); color: var(--ok); }
  .btn-ok:hover { background: var(--ok-bg); }
  .btn-no { background: transparent; border-color: var(--rule-2); color: var(--stop); }
  .btn-no:hover { border-color: var(--stop); }
  .btn-s { font-size: 13px; padding: 5px 11px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .panel { background: var(--paper-2); border: 1px solid var(--rule); border-radius: var(--r); padding: 22px 24px; }
  .panel.plain { background: transparent; }

  .msg { border-left: 3px solid var(--bleu); background: var(--paper-2); padding: 13px 17px; border-radius: 0 var(--r) var(--r) 0; font-size: 14px; color: var(--ink-2); }
  .msg strong { color: var(--ink); font-weight: 500; }
  .msg.ok   { border-left-color: var(--ok);   background: var(--ok-bg); }
  .msg.wait { border-left-color: var(--jaune);background: var(--wait-bg); }
  .msg.stop { border-left-color: var(--stop); background: var(--stop-bg); }

  .stack { display: flex; flex-direction: column; }
  .flexrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 46px; align-items: start; }
  .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }

  dl.spec { display: grid; grid-template-columns: auto 1fr; gap: 0; margin: 0; font-size: 14.5px; }
  dl.spec dt { color: var(--ink-3); padding: 9px 26px 9px 0; border-bottom: 1px solid var(--rule); }
  dl.spec dd { margin: 0; color: var(--ink); padding: 9px 0; border-bottom: 1px solid var(--rule); text-align: right; font-weight: 400; }

  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
  th {
    text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--ink-3); padding: 0 14px 10px 0; border-bottom: 2px solid var(--ink);
  }
  th:last-child { padding-right: 0; }
  td { padding: 13px 14px 13px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  td:last-child { padding-right: 0; }

  .bar-meter { height: 3px; background: var(--paper-3); border-radius: 2px; overflow: hidden; }
  .bar-meter > i { display: block; height: 100%; background: var(--rose); transition: width .5s cubic-bezier(.2,.75,.3,1); }
  .bar-meter.done > i { background: var(--ok); }

  .steps { display: flex; align-items: center; gap: 0; margin: 0 0 34px; }
  .steps .s { display: flex; align-items: center; gap: 9px; }
  .steps .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rule-2); flex: none; }
  .steps .s.on .dot { background: var(--rose); }
  .steps .lab { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .steps .s.on .lab { color: var(--ink); font-weight: 500; }
  .steps .link { flex: 1; height: 1px; background: var(--rule-2); margin: 0 13px; min-width: 18px; }
  .steps .link.on { background: var(--rose); }

  .profilecard { border-top: 2px solid var(--ink); padding-top: 20px; display: flex; flex-direction: column; gap: 11px; }
  .profilecard.off { border-top-color: var(--rule-2); }
  .profilecard.off h2, .profilecard.off p { color: var(--ink-3); }
  .profilecard h2 { font-size: 17px; letter-spacing: -.01em; }  /* garde l'allure du h3 */
  .profilecard .n { font-size: 13px; color: var(--rose); font-weight: 500; }
  .profilecard.off .n { color: var(--ink-3); }

  .cmp .was { color: var(--ink-3); }
  .cmp .now { color: var(--ink); font-weight: 400; }
  .cmp td:first-child { font-weight: 500; color: var(--ink); }

  footer.pied {
    border-top: 1px solid var(--rule); margin-top: 60px; padding: 22px 0 0;
    font-size: 12.5px; color: var(--ink-3); display: flex; gap: 18px; justify-content: space-between; flex-wrap: wrap;
  }


  /* WCAG 2.4.1 — lien d'évitement, visible seulement au clavier */
  .skip {
    position: absolute; left: 8px; top: -60px; z-index: 100;
    background: var(--plum); color: #fff; padding: 10px 16px;
    border-radius: var(--r); font-size: 14px; font-weight: 500; text-decoration: none;
    transition: top .15s;
  }
  .skip:focus { top: 8px; }

  /* lignes de résultat actionnables : de vrais boutons, atteignables au clavier */
  button.row {
    width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule);
    background: transparent; font: inherit; color: inherit; cursor: pointer;
  }
  button.row:hover { background: var(--paper-2); }

  .toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 9px; z-index: 60; }
  .toast {
    background: var(--plum); color: #fff; border-left: 3px solid var(--rose);
    border-radius: var(--r); padding: 12px 17px; font-size: 13.5px; max-width: 340px;
    box-shadow: 0 16px 36px -18px rgba(49,12,37,.7); animation: rise .26s cubic-bezier(.2,.75,.3,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }

  /* ------------------------------------------- bandeau de consentement */
  .consent {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
    background: var(--paper); border-top: 2px solid var(--ink);
    box-shadow: 0 -20px 44px -26px rgba(49,12,37,.5);
    max-height: 86vh; overflow-y: auto;
    animation: rise .3s cubic-bezier(.2,.75,.3,1);
  }
  .consent .in {
    max-width: var(--shell); margin: 0 auto; padding: 20px 24px 22px;
    display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: center;
  }
  .consent .say { flex: 1 1 400px; min-width: 0; }
  .consent h2 { font-size: 18px; font-weight: 600; letter-spacing: -.012em; }
  .consent p { font-size: 14px; line-height: 1.55; color: var(--ink-2); margin-top: 8px; max-width: 66ch; }
  /* les deux boutons de décision sont identiques : refuser ne doit pas coûter un clic de plus */
  .consent .acts { flex: 0 1 auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .consent .acts .btn { min-width: 132px; justify-content: center; }
  .consent .prefs { flex: 1 1 100%; border-top: 1px solid var(--rule); }
  .consent .cat { display: flex; gap: 15px; padding: 14px 0; border-bottom: 1px solid var(--rule); align-items: flex-start; }
  .consent .cat input { flex: none; margin: 4px 0 0; width: 17px; height: 17px; accent-color: var(--rose-deep); }
  .consent .cat .t { display: block; font-weight: 500; color: var(--ink); font-size: 14.5px; }
  .consent .cat .d { font-size: 13px; color: var(--ink-3); margin-top: 2px; line-height: 1.5; }
  body.consent-on { padding-bottom: 230px; }

  .view { animation: soften .24s ease-out; }
  @keyframes soften { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

  /* listes à deux colonnes : le détail à gauche, le verdict et les actions à droite */
  .verdict { flex: none; text-align: right; min-width: 150px; }
  .verdict.wide { min-width: 300px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; }

  @media (max-width: 620px) {
    /* sous cette largeur, la colonne de droite réduit le titre à un mot par ligne */
    .rows.detail .row { flex-wrap: wrap; }
    .rows.detail .row .grow { flex: 1 1 100%; }
    .verdict, .verdict.wide {
      width: 100%; min-width: 0; text-align: left; margin-top: 12px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-start;
    }
    .verdict .tag { display: inline-block !important; margin: 0 !important; }
  }

  @media (max-width: 760px) {
    .consent .in { padding: 16px 18px 18px; }
    .consent .acts { flex: 1 1 100%; }
    .consent .acts .btn { flex: 1 1 44%; min-width: 0; }
    body.consent-on { padding-bottom: 300px; }
  }

  /* --------------------------------------------------------- impression */
  /* Un écran de recette imprimé sert en réunion. Sans ces règles, on sort huit
     pages de fonds prune et de boutons morts. */
  @media print {
    :root {
      --paper: #fff; --paper-2: #fff; --paper-3: #fff;
      --rule: #ccc; --rule-2: #999;
      --ink: #000; --ink-2: #333; --ink-3: #555; --plum-text: #000;
      --ok: #0a5a43; --wait: #6b5400; --stop: #99101f; --info: #0f5c72;
      --ok-bg: #fff; --wait-bg: #fff; --stop-bg: #fff; --info-bg: #fff;
    }
    .notice, .consent, .toasts, .tabs, .whoami, .skip, .masthead .ridge { display: none !important; }
    .masthead { background: #fff !important; border-bottom: 2px solid #000; padding: 0; }
    .masthead .inner { padding: 0 0 10px; }
    .masthead .wordmark .l1, .masthead .wordmark .l2 { color: #000 !important; }
    body { background: #fff; font-size: 11pt; padding-bottom: 0 !important; }
    main { padding: 0 !important; max-width: none; }
    .btn, button { display: none !important; }
    .tag { border: 1px solid currentColor; }
    .panel { border: 1px solid #999; }
    .msg { border: 1px solid #999; border-left-width: 3px; }
    .row, .section, .figures > div, tr { break-inside: avoid; page-break-inside: avoid; }
    h1 { font-size: 20pt; }
    .section { margin-top: 26px; }
    a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 9pt; color: #555; }
    /* la provenance, sur chaque page imprimée */
    footer.pied::after {
      content: "Maquette de démonstration — données fictives, aucun e-mail envoyé, aucune donnée conservée.";
      display: block; margin-top: 8px; font-size: 9pt; color: #000;
    }
  }

  @media (max-width: 900px) {
    .cols, .cols3 { grid-template-columns: 1fr; gap: 30px; }
    .figures > div + div { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); }
    main { padding: 28px 18px 70px; }
    .masthead .inner { padding: 16px 18px 0; }
    .masthead .ridge { display: none; }
    .steps { overflow-x: auto; }
  }
</style>

<script>
(function () {
  "use strict";

  const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

  // --------------------------------------------------------------- code QR
  // Encodeur écrit ici plutôt qu'importé d'un CDN : la maquette n'embarque aucun code
  // tiers, et l'écran Traceurs compte ses requêtes. Mode octet, correction de niveau M,
  // versions 1 à 10 — de quoi tenir une URL, un jeton de billet ou une URI otpauth.
  // Vérifié par relecture : 200 charges aléatoires encodées puis redécodées à l'identique.
  const QR = (() => {
    const ECC_PAR_BLOC = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];   // niveau M, versions 1..10
    const BLOCS        = [0,  1,  1,  1,  2,  2,  4,  4,  4,  5,  5];
    const FORMAT_M     = 0;                                             // bits de niveau pour M

    // --- corps de Galois GF(256), polynôme générateur 0x11D
    function mul(x, y) {
      let z = 0;
      for (let i = 7; i >= 0; i--) {
        z = (z << 1) ^ ((z >>> 7) * 0x11D);
        z ^= ((y >>> i) & 1) * x;
      }
      return z & 0xFF;
    }

    function polyGen(deg) {
      const r = new Uint8Array(deg);
      r[deg - 1] = 1;
      let root = 1;
      for (let i = 0; i < deg; i++) {
        for (let j = 0; j < deg; j++) {
          r[j] = mul(r[j], root);
          if (j + 1 < deg) r[j] ^= r[j + 1];
        }
        root = mul(root, 2);
      }
      return r;
    }

    function reste(data, deg) {
      const gen = polyGen(deg);
      const res = new Uint8Array(deg);
      for (const b of data) {
        const f = b ^ res[0];
        res.copyWithin(0, 1);
        res[deg - 1] = 0;
        for (let i = 0; i < deg; i++) res[i] ^= mul(gen[i], f);
      }
      return res;
    }

    // --- géométrie
    function modulesBruts(v) {
      let n = (16 * v + 128) * v + 64;
      if (v >= 2) {
        const a = Math.floor(v / 7) + 2;
        n -= (25 * a - 10) * a - 55;
        if (v >= 7) n -= 36;      // deux exemplaires de 18 modules d'information de version
      }
      return n;
    }

    const capacite = v => Math.floor(modulesBruts(v) / 8) - ECC_PAR_BLOC[v] * BLOCS[v];

    function alignements(v) {
      if (v === 1) return [];
      const n = Math.floor(v / 7) + 2;
      const taille = v * 4 + 17;
      const pas = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
      const out = [6];
      for (let pos = taille - 7; out.length < n; pos -= pas) out.splice(1, 0, pos);
      return out;
    }

    // --- BCH pour les informations de format et de version
    function bch(donnee, gen, longueur) {
      let r = donnee;
      for (let i = 0; i < longueur; i++) r = (r << 1) ^ ((r >>> (longueur - 1)) * gen);
      return r;
    }

    function bitsFormat(masque) {
      const d = (FORMAT_M << 3) | masque;
      return ((d << 10) | bch(d, 0x537, 10)) ^ 0x5412;
    }

    function bitsVersion(v) {
      return (v << 12) | bch(v, 0x1F25, 12);
    }

    // --- construction du flux de données
    function fluxDonnees(octetsTexte, v) {
      const bits = [];
      const push = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
      push(4, 4);                                   // mode octet
      push(octetsTexte.length, v < 10 ? 8 : 16);    // nombre de caractères
      for (const o of octetsTexte) push(o, 8);

      const cap = capacite(v) * 8;
      push(0, Math.min(4, cap - bits.length));      // terminateur
      while (bits.length % 8 !== 0) bits.push(0);

      const mots = [];
      for (let i = 0; i < bits.length; i += 8) {
        let o = 0;
        for (let j = 0; j < 8; j++) o = (o << 1) | bits[i + j];
        mots.push(o);
      }
      for (let pad = 0xEC; mots.length < capacite(v); pad ^= 0xEC ^ 0x11) mots.push(pad);
      return mots;
    }

    // --- entrelacement des blocs de données et de correction
    function entrelacer(mots, v) {
      const nbBlocs = BLOCS[v], longEcc = ECC_PAR_BLOC[v];
      const brutMots = Math.floor(modulesBruts(v) / 8);
      const courts = nbBlocs - (brutMots % nbBlocs);
      const longCourt = Math.floor(brutMots / nbBlocs) - longEcc;

      const blocs = [];
      let k = 0;
      for (let i = 0; i < nbBlocs; i++) {
        const n = longCourt + (i < courts ? 0 : 1);
        const donnees = mots.slice(k, k + n);
        k += n;
        blocs.push({ donnees, ecc: reste(donnees, longEcc) });
      }

      const out = [];
      for (let i = 0; i <= longCourt; i++) {
        blocs.forEach((b, j) => {
          // le bloc court n'a pas de dernier octet de données : on le saute
          if (i < b.donnees.length) out.push(b.donnees[i]);
        });
      }
      for (let i = 0; i < longEcc; i++) blocs.forEach(b => out.push(b.ecc[i]));
      return out;
    }

    // --- matrice
    function matrice(v, mots) {
      const t = v * 4 + 17;
      const m = Array.from({ length: t }, () => new Int8Array(t).fill(-1));   // -1 = libre

      const pose = (x, y, val) => { if (x >= 0 && x < t && y >= 0 && y < t) m[y][x] = val; };

      // motifs de détection de position, aux trois coins
      const reperes = [[0, 0], [t - 7, 0], [0, t - 7]];
      reperes.forEach(([ox, oy]) => {
        for (let dy = -1; dy <= 7; dy++) for (let dx = -1; dx <= 7; dx++) {
          const d = Math.max(Math.abs(dx - 3), Math.abs(dy - 3));
          pose(ox + dx, oy + dy, (d !== 2 && d !== 4) ? 1 : 0);
        }
      });

      // motifs d'alignement
      const al = alignements(v);
      al.forEach(cy => al.forEach(cx => {
        if ((cx === 6 && cy === 6) || (cx === 6 && cy === t - 7) || (cx === t - 7 && cy === 6)) return;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          pose(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1 ? 1 : 0);
        }
      }));

      // motifs de synchronisation
      for (let i = 8; i < t - 8; i++) {
        const val = (i % 2 === 0) ? 1 : 0;
        if (m[6][i] === -1) m[6][i] = val;
        if (m[i][6] === -1) m[i][6] = val;
      }

      // emplacements réservés aux informations de format
      const reserve = [];
      for (let i = 0; i < 9; i++) { reserve.push([i, 8]); reserve.push([8, i]); }
      for (let i = 0; i < 8; i++) { reserve.push([t - 1 - i, 8]); reserve.push([8, t - 1 - i]); }
      reserve.forEach(([x, y]) => { if (m[y][x] === -1) m[y][x] = 0; });
      m[t - 8][8] = 1;                                    // module toujours sombre

      if (v >= 7) {                                        // informations de version
        const bv = bitsVersion(v);
        for (let i = 0; i < 18; i++) {
          const b = (bv >>> i) & 1;
          m[t - 11 + (i % 3)][Math.floor(i / 3)] = b;
          m[Math.floor(i / 3)][t - 11 + (i % 3)] = b;
        }
      }

      // dépôt des données en zigzag, colonnes par deux, depuis la droite
      let i = 0;
      for (let droite = t - 1; droite >= 1; droite -= 2) {
        if (droite === 6) droite = 5;                      // la colonne 6 est un motif de synchro
        for (let vert = 0; vert < t; vert++) {
          for (let j = 0; j < 2; j++) {
            const x = droite - j;
            const montant = ((droite + 1) & 2) === 0;
            const y = montant ? t - 1 - vert : vert;
            if (m[y][x] === -1) {
              m[y][x] = i < mots.length * 8 ? (mots[i >>> 3] >>> (7 - (i & 7))) & 1 : 0;
              i++;
            }
          }
        }
      }
      return { m, t, reserve };
    }

    const FONCTION = [
      (x, y) => (x + y) % 2,
      (x, y) => y % 2,
      (x, y) => x % 3,
      (x, y) => (x + y) % 3,
      (x, y) => (Math.floor(y / 2) + Math.floor(x / 3)) % 2,
      (x, y) => (x * y) % 2 + (x * y) % 3,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2,
      (x, y) => ((x + y) % 2 + (x * y) % 3) % 2
    ];

    // --- pénalités, pour choisir le masque le moins lisible de travers
    function penalite(m, t) {
      let p = 0;
      // règle 3 : motif 1:1:3:1:1 précédé ou suivi de quatre modules clairs
      const motif3 = (get) => {
        for (let a = 0; a < t; a++) {
          for (let b = 0; b <= t - 11; b++) {
            const lis = k => get(a, b + k);
            const noyau = lis(0) && !lis(1) && lis(2) && lis(3) && lis(4) && !lis(5) && lis(6);
            if (noyau) {
              const avant = b >= 4 && !lis(-1) && !lis(-2) && !lis(-3) && !lis(-4);
              const apres = b + 10 < t && !lis(7) && !lis(8) && !lis(9) && !lis(10);
              if (avant || apres) p += 40;
            }
          }
        }
      };

      // séries horizontales et verticales (règles 1 et 2 partiellement)
      for (let y = 0; y < t; y++) {
        let n = 1;
        for (let x = 1; x < t; x++) {
          if (m[y][x] === m[y][x - 1]) { n++; if (n === 5) p += 3; else if (n > 5) p++; }
          else n = 1;
        }
      }
      for (let x = 0; x < t; x++) {
        let n = 1;
        for (let y = 1; y < t; y++) {
          if (m[y][x] === m[y - 1][x]) { n++; if (n === 5) p += 3; else if (n > 5) p++; }
          else n = 1;
        }
      }
      // règle 2 : blocs 2×2 de même couleur
      for (let y = 0; y < t - 1; y++) for (let x = 0; x < t - 1; x++) {
        const c = m[y][x];
        if (c === m[y][x + 1] && c === m[y + 1][x] && c === m[y + 1][x + 1]) p += 3;
      }
      motif3((a, b) => m[a][b]);            // horizontal
      motif3((a, b) => m[b][a]);            // vertical
      // règle 4 : déséquilibre entre sombre et clair
      let sombres = 0;
      for (let y = 0; y < t; y++) for (let x = 0; x < t; x++) sombres += m[y][x];
      const total = t * t;
      const ecart = Math.ceil(Math.abs(sombres * 20 - total * 10) / total) - 1;
      p += Math.max(ecart, 0) * 10;
      return p;
    }

    function estFonction(t, reserve, x, y, v) {
      // vrai si le module appartient à un motif de service, donc non masquable
      const dansRepere = (ox, oy) => x >= ox - 1 && x <= ox + 7 && y >= oy - 1 && y <= oy + 7;
      if (dansRepere(0, 0) || dansRepere(t - 7, 0) || dansRepere(0, t - 7)) return true;
      if (x === 6 || y === 6) return true;
      const al = alignements(v);
      for (const cy of al) for (const cx of al) {
        if ((cx === 6 && cy === 6) || (cx === 6 && cy === t - 7) || (cx === t - 7 && cy === 6)) continue;
        if (Math.abs(x - cx) <= 2 && Math.abs(y - cy) <= 2) return true;
      }
      if (v >= 7) {
        if (y < 6 && x >= t - 11 && x <= t - 9) return true;
        if (x < 6 && y >= t - 11 && y <= t - 9) return true;
      }
      if (reserve.some(([rx, ry]) => rx === x && ry === y)) return true;
      if (x === 8 && y === t - 8) return true;
      return false;
    }

    // --- API
    function encoder(texte) {
      const oct = new TextEncoder().encode(texte);
      let v = 0;
      for (let essai = 1; essai <= 10; essai++) {
        const bitsEntete = 4 + (essai < 10 ? 8 : 16);
        if (bitsEntete + oct.length * 8 <= capacite(essai) * 8) { v = essai; break; }
      }
      if (!v) return null;                       // au-delà, il faudrait les versions supérieures

      const mots = entrelacer(fluxDonnees(oct, v), v);
      const base = matrice(v, mots);
      const t = base.t;

      let meilleur = null;
      for (let masque = 0; masque < 8; masque++) {
        const m = base.m.map(l => Int8Array.from(l));
        for (let y = 0; y < t; y++) for (let x = 0; x < t; x++) {
          if (!estFonction(t, base.reserve, x, y, v) && FONCTION[masque](x, y) === 0) m[y][x] ^= 1;
        }
        // Informations de format, en deux exemplaires. Attention à l'ordre : la norme
        // se lit en (colonne, ligne), la matrice s'écrit en [ligne][colonne].
        const bf = bitsFormat(masque);
        const bit = i => (bf >>> i) & 1;
        for (let i = 0; i <= 5; i++) m[i][8] = bit(i);      // colonne 8, lignes 0 à 5
        m[7][8] = bit(6);
        m[8][8] = bit(7);
        m[8][7] = bit(8);                                   // ligne 8, colonne 7
        for (let i = 9; i < 15; i++) m[8][14 - i] = bit(i); // ligne 8, colonnes 5 à 0
        for (let i = 0; i < 8; i++) m[8][t - 1 - i] = bit(i);
        for (let i = 8; i < 15; i++) m[t - 15 + i][8] = bit(i);
        m[t - 8][8] = 1;                                    // module toujours sombre

        const p = penalite(m, t);
        if (!meilleur || p < meilleur.p) meilleur = { m, p, masque };
      }
      return { modules: meilleur.m, taille: t, version: v, masque: meilleur.masque };
    }

    function svg(texte, cote) {
      const q = encoder(texte);

      const marge = 4;
      const total = q.taille + marge * 2;
      let d = "";
      for (let y = 0; y < q.taille; y++) for (let x = 0; x < q.taille; x++) {
        if (q.modules[y][x]) d += `M${x + marge},${y + marge}h1v1h-1z`;
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="${cote}" height="${cote}" shape-rendering="crispEdges" role="img" aria-label="Code QR"><rect width="${total}" height="${total}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
    }

    return { encoder, svg, capacite };

  function pwdScore(v) {
    let s = 0;
    if (v.length >= 12) s++;
    if (v.length >= 16) s++;
    if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
    if (/\d/.test(v)) s++;
    if (/[^\w\s]/.test(v)) s++;
    return Math.min(s, 4);
  }
  const PWD_TXT = ["Trop court", "Faible", "Correct", "Bon", "Solide"];
  const PWD_COL = ["--stop", "--stop", "--wait", "--ok", "--ok"];

  function pwdMeter(v) {
    if (!v) return "";
    const s = pwdScore(v);
    return `<div class="flexrow" style="gap:10px">
      <div class="bar-meter" style="flex:1"><i style="width:${(s + 1) * 20}%;background:var(${PWD_COL[s]})"></i></div>

  }

          <div style="padding-top:20px" class="stack">
            <div class="num" style="font-size:52px;font-weight:200;letter-spacing:-.03em;line-height:1;color:var(--ink)">${f} %</div>
            <div class="bar-meter${f === 100 ? " done" : ""}" style="margin:16px 0 14px"><i style="width:${f}%"></i></div>
            <p style="font-size:14px;color:var(--ink-2)">Le dossier ne part à l'office que lorsque toutes les pièces sont là. L'office n'instruit jamais un dossier incomplet.</p>
            ${l.status === "DRAFT" ? `<button class="btn btn-1" data-send="${l.id}" style="align-self:flex-start;margin-top:16px"${ready ? "" : " disabled"}>Envoyer à l'office</button>` : ""}
          </div>
        </div>
      </div>

      ${ownersBlock(l)}

      <div class="section">
        <div class="bar"><h2>Pièces justificatives</h2><span class="count">${l.docs.length}</span></div>
        <div class="tablewrap"><table><thead><tr><th scope="col">Pièce</th><th scope="col">Fichier</th><th scope="col">Statut</th><th scope="col"></th></tr></thead><tbody>${docRows}</tbody></table></div>
      </div>`;
  };

  V.adhesion = () => {
    const a = state.adhesion;
    let body;

    if (!a.cgu) {
      body = `
        <div class="msg wait"><strong>Conditions générales à accepter.</strong> La version acceptée et l'horodatage sont conservés — c'est ce qui fait foi en cas de litige.</div>
        <div style="max-height:172px;overflow:auto;border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px;font-size:14px;color:var(--ink-2);margin:18px 0">
          <p><strong style="color:var(--ink)">Article 1 — Objet.</strong> La présente adhésion lie le propriétaire d'un meublé de tourisme situé sur la commune à l'office de tourisme, pour la saison ${a.season}.</p>
          <p style="margin-top:12px"><strong style="color:var(--ink)">Article 2 — Engagements du propriétaire.</strong> Déclarer chaque bien mis en location, tenir à jour les attestations d'assurance et de classement, signaler tout changement de capacité en cours de saison.</p>
          <p style="margin-top:12px"><strong style="color:var(--ink)">Article 3 — Cotisation.</strong> Le montant suit le barème voté par le conseil d'administration. Il est exigible à réception de la facture.</p>
        </div>
        <button class="btn btn-1" data-cgu="1">J'accepte les conditions générales</button>`;
    } else if (a.status === "DRAFT") {
      body = `
        <div class="msg ok"><strong>Conditions acceptées</strong> le ${esc(a.cguAt || "—")}, version <span class="num">2026-07-A</span>. C'est cet horodatage qui fait foi, pas une case cochée quelque part.</div>
        <p style="margin:18px 0">Votre dossier comporte ${state.lgts.length} logements pour ${beds()} lits. Vous pouvez le transmettre à l'office.</p>
        <button class="btn btn-1" data-adh="send">Envoyer mon dossier d'adhésion</button>`;
    } else if (a.status === "SUBMITTED") {
      body = `
        <div class="msg"><strong>Dossier transmis.</strong> L'office l'instruit. Vous recevrez un e-mail à chaque étape.</div>
`;
    } else {
      body = `
        <div class="msg ok"><strong>Adhésion validée</strong> pour la saison ${a.season}. Votre dossier est complet.</div>
        <dl class="spec" style="margin:20px 0">
          <dt>Saison</dt><dd class="num">${a.season}</dd>
          <dt>Logements couverts</dt><dd class="num">${state.lgts.length}</dd>
          <dt>Cotisation</dt><dd>appelée par l'office</dd>
        </dl>
        <p class="small">La cotisation est appelée par l'office, hors de cet espace.</p>`;
    }

    const order = ["DRAFT", "SUBMITTED", "VALIDATED"];
    const names = { DRAFT: "Préparation", SUBMITTED: "Instruction", VALIDATED: "Validée" };
    const at = order.indexOf(a.status);
    const steps = `<div class="steps">${order.map((s, i) => `
      <div class="s${i <= at ? " on" : ""}"><span class="dot"></span><span class="lab">${names[s]}</span></div>
      ${i < order.length - 1 ? `<span class="link${i < at ? " on" : ""}"></span>` : ""}`).join("")}</div>`;

    return `
      <div class="head"><div>
        <h1>Mon adhésion</h1>
        <p class="lede">Saison ${a.season}. Conditions générales, envoi du dossier, validation par l'office, puis appel de la cotisation — que l'office lance par ses moyens habituels, hors de cet outil en version 1.</p>
      </div></div>
      ${steps}
      <div class="cols">
        <div class="panel">${body}</div>
        <div>
          <div class="bar" style="display:flex;justify-content:space-between;align-items:baseline;padding-bottom:11px;border-bottom:2px solid var(--ink)"><h2>Ce que l'adhésion vous ouvre</h2></div>
          <div class="rows">
            ${[
              ["Tarif propriétaire", "Sur le forfait Espace San Bernardo, La Rosière et La Thuile."],
              ["Visibilité", "Votre logement apparaît sur les supports de communication de l'office."],
              ["Accompagnement", "Classement meublé, déclaration en mairie, taxe de séjour."]
            ].map(([t, d]) => `<div class="row"><div class="grow"><div class="title">${t}</div><div class="sub" style="font-size:13.5px;color:var(--ink-2);line-height:1.5">${d}</div></div></div>`).join("")}
          </div>
        </div>
      </div>`;
  };

  // ------------------------------------------------------ avantages et billets
  // Un billet est un jeton à usage unique. Le code QR ne contient aucun droit :
  // juste l'identifiant. Le falsifier ne sert à rien, c'est le contrôle qui décide.
  const billetsDe = id => state.avantages.billets.filter(b => b.droit === id);
  const restants = d => d.quota - billetsDe(d.id).length;

  function codeBillet(droitId) {
    const alpha = "ACDEFGHJKLMNPQRTUVWXY34679";     // sans les caractères qu'on confond
    let s = "";
    for (let i = 0; i < 8; i++) s += alpha[Math.floor(Math.random() * alpha.length)];
    return `LR26-${droitId.toUpperCase().slice(0, 4)}-${s}`;
  }

  const billet = code => state.avantages.billets.find(b => b.code === code);
  const droitDe = id => state.avantages.droits.find(d => d.id === id);

  function blocQR(texte, cote) {
    const svg = QR.svg(texte, cote);
    return svg
      ? `<div style="background:#fff;padding:10px;border-radius:var(--r);display:inline-block;line-height:0">${svg}</div>`
      : `<div class="msg stop">Charge trop longue pour un code de version 10.</div>`;
  }

  V.avantages = () => {
    const b = state.billetVu ? billet(state.billetVu) : null;
    const vue = b ? (() => {
      const d = droitDe(b.droit);
      return `
        <div style="max-width:420px;margin:0 auto">
          <div class="panel stack" style="gap:16px;align-items:center;text-align:center">
            <div>
              <div style="font-weight:500;color:var(--ink);font-size:17px">${esc(d.nom)}</div>
              <div class="sub">${esc(state.adhesion.season)} · ${esc(state.owner.firstName + " " + state.owner.lastName)}</div>
            </div>
            ${b.etat === "UTILISE"
              ? `<div class="msg stop" style="text-align:left"><strong>Billet déjà utilisé</strong> le ${esc(b.scanneLe)}, contrôlé par ${esc(b.scannePar)}. Il n'est plus valable, et le code QR a été retiré pour éviter toute confusion.</div>`
              : blocQR(b.code, 232)}
            <div class="num" style="font-size:15px;letter-spacing:.06em;color:var(--ink)">${esc(b.code)}</div>
            <div class="small">Émis le ${esc(b.emisLe)}. ${b.etat === "UTILISE" ? "Consommé." : "Valable une fois, sur présentation à l'entrée."}</div>
            <div class="flexrow" style="justify-content:center">
              <button class="btn btn-2 btn-s" data-billet-retour="1">← Tous mes billets</button>
              ${b.etat === "VALIDE" ? `<button class="btn btn-no btn-s" data-annuler="${esc(b.code)}">Annuler ce billet</button>` : ""}
            </div>
          </div>
        </div>`;
    })() : `
      <div class="cols3" style="margin-bottom:8px">
        ${state.avantages.droits.map(d => {
          const r = restants(d);
          return `
          <div class="profilecard${r === 0 ? " off" : ""}">
            <span class="n">${r} sur ${d.quota}</span>
            <h2>${esc(d.nom)}</h2>
            <p style="font-size:14px;color:var(--ink-2)">${esc(d.detail)}</p>
            <div class="bar-meter${r === 0 ? "" : " done"}" style="margin:4px 0 10px"><i style="width:${(r / d.quota) * 100}%"></i></div>
            <button class="btn ${r ? "btn-1" : "btn-2"} btn-s" style="align-self:flex-start" data-emettre="${d.id}"${r ? "" : " disabled"}>${r ? "Éditer un billet" : "Quota atteint"}</button>
          </div>`;
        }).join("")}
      </div>

      <div class="section">
        <div class="bar"><h2>Mes billets</h2><span class="count">${state.avantages.billets.length || "aucun"}</span></div>
        ${state.avantages.billets.length
          ? `<div class="rows detail" style="margin-top:2px">${state.avantages.billets.map(b2 => `
              <div class="row">
                <div class="grow">
                  <div class="title">${esc(droitDe(b2.droit).nom)}</div>
                  <div class="sub num">${esc(b2.code)} · émis le ${esc(b2.emisLe)}${b2.etat === "UTILISE" ? ` · contrôlé le ${esc(b2.scanneLe)}` : ""}</div>
                </div>
                <div class="verdict">
                  <span class="tag ${b2.etat === "UTILISE" ? "t-idle" : "t-ok"}" style="display:block;margin-bottom:8px">${b2.etat === "UTILISE" ? "Utilisé" : "Valable"}</span>
                  <button class="btn btn-2 btn-s" data-billet="${esc(b2.code)}">${b2.etat === "UTILISE" ? "Voir" : "Afficher le code"}</button>
                </div>
              </div>`).join("")}</div>`
          : `<div class="msg" style="margin-top:18px"><strong>Aucun billet édité.</strong> Vos droits restent entiers : un billet ne s'édite qu'au moment d'y aller.</div>`}
        <p class="small" style="margin-top:16px">Les entrées sont attachées à l'adhésion de la saison ${esc(state.adhesion.season)} et ne se reportent pas d'une saison sur l'autre.</p>
      </div>`;

    return `
      <div class="head"><div>
        <h1>Mes avantages</h1>
        <p class="lede">Vos entrées de la saison. Un billet s'édite au moment d'y aller, se présente à l'entrée, et ne sert qu'une fois.</p>
      </div></div>
      ${vue}`;
  };

  V["ot-controle"] = () => {
    const scan = state.scan;
    const dernier = state.avantages.billets.find(b => b.etat === "VALIDE");
    const verdict = !scan ? "" : scan.verdict === "OK"
      ? `<div class="msg ok"><strong>Entrée autorisée.</strong> ${esc(scan.qui)} · ${esc(scan.quoi)}. Le billet vient d'être consommé : un second passage sera refusé.</div>`
      : scan.verdict === "DEJA"
        ? `<div class="msg stop"><strong>Billet déjà utilisé</strong> le ${esc(scan.quand)}, par ${esc(scan.par)}. Entrée refusée.</div>`
        : `<div class="msg stop"><strong>Billet inconnu.</strong> Ce code ne correspond à aucun billet émis. Entrée refusée — et la tentative est inscrite au journal.</div>`;

    return `
      <div class="head"><div>
        <h1>Contrôle à l'entrée</h1>
        <p class="lede">Un code scanné, une réponse : autorisé, déjà utilisé, ou inconnu.</p>
      </div></div>

      <div style="max-width:600px">
        <form class="panel stack" style="gap:16px" id="form-controle">
          ${champ("c-code", "Code du billet", { placeholder: "LR26-CINE-XXXXXXXX",
            hint: "Au comptoir, ce champ est rempli par la douchette ou par l'appareil photo du téléphone. Ici, tapez ou collez le code." })}
          ${verdict}
          <div class="flexrow">
            <button type="submit" class="btn btn-1">Contrôler</button>
            ${dernier ? `<button type="button" class="btn btn-2" data-coller-billet="${esc(dernier.code)}">Coller un billet valable</button>` : ""}
            ${scan && scan.verdict === "OK" ? `<button type="button" class="btn btn-2" data-coller-billet="${esc(scan.code)}">Rejouer le même billet</button>` : ""}
          </div>
        </form>

      </div>`;
  };

  V.compte = () => `
    <div class="head"><div>
      <h1>Mon compte</h1>
      <p class="lede">Vos coordonnées, votre mot de passe, et vos données : export et suppression en libre-service.</p>
    </div></div>
    <div class="cols">
      <div>
        <div class="bar" style="display:flex;justify-content:space-between;align-items:baseline;padding-bottom:11px;border-bottom:2px solid var(--ink)"><h2>Mes informations</h2></div>
        <dl class="spec">
          <dt>Nom</dt><dd>${esc(state.owner.firstName + " " + state.owner.lastName)}</dd>
          <dt>Adresse e-mail</dt><dd>${esc(state.owner.email)}</dd>
          <dt>Téléphone</dt><dd class="num">${esc(state.owner.phone)}</dd>
          <dt>Statut</dt><dd>${esc(state.owner.kind)}</dd>
          <dt>Commune de résidence</dt><dd>${esc(state.owner.town)}</dd>
        </dl>
        <div class="flexrow" style="margin-top:18px">
          <button class="btn btn-2 btn-s" data-toast="Dans le produit final : modification des coordonnées.">Modifier</button>
          <button class="btn btn-2 btn-s" data-toast="Dans le produit final : changement de mot de passe, avec vérification de l'ancien.">Changer de mot de passe</button>
        </div>
      </div>
      <div>
        <div class="bar" style="display:flex;justify-content:space-between;align-items:baseline;padding-bottom:11px;border-bottom:2px solid var(--ink)"><h2>Mes données</h2></div>
        <p style="margin:20px 0;color:var(--ink-2)">Export complet au format JSON, et suppression du compte sans passer par personne.</p>
        <div class="flexrow">
          <button class="btn btn-2 btn-s" data-toast="Export JSON généré et envoyé par e-mail.">Exporter mes données</button>
          <button class="btn btn-no btn-s" data-toast="Données personnelles effacées, journal d'audit anonymisé.">Supprimer mon compte</button>
        </div>
        <p class="small" style="margin-top:16px">À la suppression, le journal d'audit reste, mais détaché de votre identité : on garde la traçabilité, pas la personne.</p>
      </div>
    </div>`;

  V["ot-file"] = () => {
    const q = queue();
    const rows = q.map(({ l, d, i }) => {
      const enCours = state.review && state.review.id === l.id && state.review.i === i;
      const ligne = `
      <tr>
        <td><span style="font-weight:500;color:var(--ink)">${esc(l.name)}</span><br><span class="sub num">${l.id} · ${esc(l.sector)}</span></td>
        <td>${esc(d.label)}</td>
        <td style="color:var(--ink-3)">${esc(d.file)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-ok btn-s" data-rev="${l.id}:${i}:ok">Valider</button>
          <button class="btn btn-no btn-s" data-rev="${l.id}:${i}:no" style="margin-left:6px"${enCours ? " disabled" : ""}>Refuser</button>
        </td>
      </tr>`;
      if (!enCours) return ligne;
      return ligne + `
      <tr><td colspan="4" style="padding:0 0 18px">
        <form class="panel stack" style="gap:14px" id="form-motif">
          <div>
            <div style="font-weight:500;color:var(--ink)">Pourquoi ce refus ?</div>
            <p class="small" style="margin-top:3px">Le propriétaire lira ce motif tel quel dans son espace, et le recevra par e-mail.</p>
          </div>
          <fieldset class="stack" style="border:0;padding:0;margin:0;gap:9px">
            <legend class="small" style="padding:0 0 4px">Motif</legend>
            ${MOTIFS.map((m, k) => `
              <label class="flexrow" style="gap:9px;font-size:14.5px;align-items:flex-start">
                <input type="radio" name="motif" value="${esc(m)}"${k === 0 ? " checked" : ""} style="margin-top:4px">
                <span>${esc(m)}</span>
              </label>`).join("")}
            <label class="flexrow" style="gap:9px;font-size:14.5px;align-items:flex-start">
              <input type="radio" name="motif" value="" style="margin-top:4px">
              <span>Autre motif, que je précise ci-dessous</span>
            </label>
          </fieldset>
          <div class="stack" style="gap:6px">
            <label for="motif-libre" class="small">Précision (facultative, sauf pour « autre motif »)</label>
            <textarea id="motif-libre" rows="2" placeholder="Ce que le propriétaire doit corriger, en une phrase."
              style="font-family:var(--sans);font-size:14.5px;padding:9px 11px;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--paper);color:var(--ink);width:100%;resize:vertical"></textarea>
          </div>
          <div class="flexrow">
            <button type="submit" class="btn btn-no btn-s">Refuser avec ce motif</button>
            <button type="button" class="btn btn-2 btn-s" data-rev-cancel="1">Annuler</button>
          </div>
        </form>
      </td></tr>`;
    }).join("");

    const adh = state.adhesion.status === "SUBMITTED" ? `
      <div class="section">
        <div class="bar"><h2>Demande d'adhésion</h2><span class="count">${state.adhesion.season}</span></div>
        <div class="panel" style="margin-top:18px">
          <div class="flexrow" style="justify-content:space-between">
            <div>
              <div style="font-weight:500;color:var(--ink)">${esc(state.owner.firstName + " " + state.owner.lastName)}</div>
              <div class="sub">${state.lgts.length} logements · ${beds()} lits · conditions générales acceptées</div>
            </div>
            <button class="btn btn-1" data-adh="validate">Valider l'adhésion</button>
          </div>
        </div>
      </div>` : "";

    const ech = echeances();
    const echBloc = ech.length ? `
      <div class="section">
        <div class="bar"><h2>Expire avant l'ouverture</h2><span class="count">saison au ${OUVERTURE}</span></div>
        <div class="rows" style="margin-top:2px">
          ${ech.map(({ l, d, jours }) => `
            <div class="row">
              <div class="grow">
                <div class="title">${esc(l.name)} — ${esc(d.label.toLowerCase())}</div>
                <div class="sub num">${l.id} · ${esc(d.until)}</div>
              </div>
              <span class="tag ${jours < 0 ? "t-stop" : "t-wait"}">${esc(enJours(jours))}</span>
            </div>`).join("")}
        </div>
        <p class="small" style="margin-top:16px">Relance automatique au propriétaire à soixante jours, puis à trente, puis à sept.</p>
      </div>` : "";

    return `
      <div class="head"><div>
        <h1>À instruire</h1>
        <p class="lede">Chaque décision notifie le propriétaire et s'inscrit au journal.</p>
      </div></div>

      ${echBloc}

      <div class="section"${ech.length ? "" : ' style="margin-top:0"'}>
        <div class="bar"><h2>Pièces en attente</h2><span class="count">${q.length}</span></div>
        ${q.length
          ? `<div class="tablewrap"><table><thead><tr><th scope="col">Logement</th><th scope="col">Pièce</th><th scope="col">Fichier</th><th scope="col"></th></tr></thead><tbody>${rows}</tbody></table></div>`
          : `<div class="msg ok" style="margin-top:18px"><strong>File vide.</strong> Toutes les pièces déposées ont été instruites.</div>`}
      </div>
      ${adh}`;
  };

  // ------------------------------------------------- annuaire de l'office
  const ADH_TXT = { DRAFT: "À préparer", SUBMITTED: "Envoyée", VALIDATED: "Validée" };
  const ADH_TAG = { DRAFT: "t-idle", SUBMITTED: "t-wait", VALIDATED: "t-ok" };
  const plat = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  // le dossier réellement manipulé dans cette maquette, présenté comme les autres
  function ficheVivante() {
    return {
      first: state.owner.firstName, last: state.owner.lastName,
      email: state.owner.email, phone: state.owner.phone,
      town: state.owner.town, kind: state.owner.kind, since: "2026",
      adh: state.adhesion.status, vivant: true,
      lgtsList: state.lgts.map(l => ({ name: l.name, sector: l.sector, beds: l.beds, status: l.status }))
    };
  }

  const annuaire = () => [ficheVivante(), ...state.annuaire];
  const litsDe = p => p.lgtsList.reduce((a, l) => a + l.beds, 0);
  const fiche = mail => annuaire().find(p => p.email === mail);

  function otListe() {
    const q = plat(state.ot.q.trim());
    return annuaire().filter(p => {
      if (state.ot.filtre !== "tous" && p.adh !== state.ot.filtre) return false;
      if (!q) return true;
      return [p.first, p.last, p.email, p.town, p.kind].some(v => plat(v).includes(q))
          || p.lgtsList.some(l => plat(l.name).includes(q));
    });
  }

  function otRows() {
    const list = otListe();
    if (!list.length) {
      return `<tr><td colspan="5" style="color:var(--ink-3);padding:22px 0">Aucun propriétaire ne correspond. La recherche porte sur le nom, l'adresse e-mail, la commune et le nom des biens.</td></tr>`;
    }
    return list.map(p => `
      <tr>
        <td>
          <button class="lien-fiche" data-otfiche="${esc(p.email)}" style="background:none;border:0;padding:0;font:inherit;color:var(--ink);font-weight:500;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px">${esc(p.last.toUpperCase() + " " + p.first)}</button>
          ${p.vivant ? `<span class="tag t-info" style="margin-left:8px;font-size:11px">dossier vivant</span>` : ""}
          <br><span class="sub">${esc(p.email)}</span>
        </td>
        <td>${esc(p.town)}</td>
        <td class="num">${p.lgtsList.length}</td>
        <td class="num">${litsDe(p)}</td>
        <td><span class="tag ${ADH_TAG[p.adh]}">${ADH_TXT[p.adh]}</span></td>
      </tr>`).join("");
  }

  V["ot-proprios"] = () => {
    const total = annuaire().length;
    const filtres = [["tous", "Tous"], ["VALIDATED", "Adhésion validée"], ["SUBMITTED", "À instruire"], ["DRAFT", "Non transmise"]];
    return `
      <div class="head">
        <div>
          <h1>Propriétaires</h1>
          <p class="lede">Recherche, filtres, export.</p>
        </div>
        <div class="flexrow">
          <button class="btn btn-2" data-csv="proprios">Exporter les propriétaires</button>
          <button class="btn btn-2" data-csv="logements">Exporter les logements</button>

    if (s.startsWith("356000000")) return [...s].reduce((a, c) => a + +c, 0) % 5 === 0;
    let total = 0;
    for (let i = 0; i < 14; i++) {
      let n = +s[13 - i];
      if (i % 2 === 1) { n *= 2; if (n > 9) n -= 9; }
      total += n;
    }
    return total % 10 === 0;

  async function siretSearch(q) {
    const url = "https://recherche-entreprises.api.gouv.fr/search?per_page=5&q=" + encodeURIComponent(q);
    const ctrl = new AbortController();
    const kill = setTimeout(() => ctrl.abort(), 4000);
    try {
      const r = await fetch(url, { signal: ctrl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      return { source: "api", results: d.results || [] };
    } catch (e) {
      // l'API est injoignable (hors ligne, CSP, maintenance INSEE) : on ne bloque jamais.
      // SIRENE stocke sans accents, l'utilisateur en tape : on aplatit les deux côtés.
      const flat = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[\s'-]/g, "");
      // recherche par mots plutôt que par sous-chaîne : « tourisme rosieres » doit trouver
      const words = q.split(/\s+/).map(flat).filter(w => w.length > 2);
      return {
        source: "local",
        reason: e.name === "AbortError" ? "délai dépassé" : e.message,
        results: SIRET_LOCAL.filter(x => {
          const hay = flat(x.nom_complet);
          return x.siege.siret.includes(q.replace(/\s/g, "")) ||
                 (words.length > 0 && words.every(w => hay.includes(w)));
        })
      };
    }
  }

        detail: COMMUNES_OK[s.commune] || `${s.libelle_commune || "commune inconnue"} — hors périmètre` },
      { ok: !!nafMatch, label: "Activité admise au partenariat",

      { ok: r.statut_diffusion !== "P" && r.statut_diffusion !== "N", label: "Diffusion publique",
        detail: (r.statut_diffusion === "P" || r.statut_diffusion === "N")
          ? "unité non diffusible — justificatif à demander" : "données ouvertes" }
    ];
    let verdict = "VERIFIED";
    if (!checks[3].ok) verdict = "RESTRICTED";
    else if (!checks[0].ok) verdict = "CLOSED";
    else if (!checks[1].ok) verdict = "OUT_OF_AREA";
    else if (!checks[2].ok) verdict = "REVIEW";
    return { checks, verdict };
  }

  // ------------------------------------------------------------- exports
  // Point-virgule et BOM UTF-8 : c'est ce qu'attend Excel en français. Sans le BOM,
  // « Bourg-Saint-Maurice » s'ouvre en « Bourg-Saint-Maurice » et l'agent renonce.
  function csv(lignes) {
    const cell = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    return "﻿" + lignes.map(l => l.map(cell).join(";")).join("\r\n");
  }

  function telecharger(nom, texte) {
    const url = URL.createObjectURL(new Blob([texte], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = nom;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  const jour = () => {
    const d = new Date(), p = n => String(n).padStart(2, "0");

      lignes.push([`${p.last} ${p.first}`, p.email, l.name, l.sector, l.beds, LGT_TXT[l.status]])));
    telecharger(`logements-larosiere-${jour()}.csv`, csv(lignes));

  // ------------------------------------------------------------- moteur
  function toast(msg) {

    box.appendChild(el);
