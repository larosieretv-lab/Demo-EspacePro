  function note(act, detail, who) {
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    state.journal.unshift({
      at: `${p(d.getDate())}/${p(d.getMonth() + 1)} ${p(d.getHours())}:${p(d.getMinutes())}`,
      // un visiteur non connecté laisse une trace, mais pas une identité
      who: who || (state.auth === "ot" ? state.agent.email
         : state.auth === "owner" ? state.owner.email
         : "visiteur non identifié"),
      act, detail
    });
  }

  function draw() {
    if (!allowed(state.view)) {
      if (state.auth) state.view = "refus";
      else { state.blocked = state.view; state.view = "connexion"; }
    }
    paintChrome();
    paintConsent();
    const fn = V[state.view] || V.accueil;
    document.getElementById("main").innerHTML = `<div class="view">${fn()}</div>
      <footer class="pied" role="contentinfo">
        <span>Maquette de proposition — Espace propriétaires de La Rosière</span>
        <span><a href="#" data-go="traceurs">Traceurs et cookies</a></span>
        <span>Charte et couleurs relevées sur larosiere.net · Lexend (licence libre) ; les titres utilisent TT Chocolate dans la charte réelle</span>
      </footer>`;
    if (state.view === "siret") siretOut();

    // le décompte du verrouillage doit tourner tant qu'on regarde l'écran de connexion
    clearInterval(lockTimer);
    if (state.view === "connexion" && locked()) {
      lockTimer = setInterval(() => {
        const box = document.getElementById("login-etat");
        if (!box) return clearInterval(lockTimer);
        box.innerHTML = loginEtat();
        if (!locked()) clearInterval(lockTimer);
      }, 1000);
    }
    ecrireAdresse();
    window.scrollTo({ top: 0, behavior: "instant" });
  }
  let lockTimer = null;

  // ------------------------------------------------------------- adresses
  // Un écran = une adresse. On peut envoyer #recette à quelqu'un, et le bouton
  // retour du navigateur fait ce qu'on attend de lui.
  // Trois écrans n'ont pas d'adresse : ils n'existent qu'au milieu d'un parcours.
  const SANS_ADRESSE = { mfa: 1, refus: 1, verif: 1 };

  let pushOk = true;        // faux si le navigateur refuse pushState (page ouverte en fichier local)
  let dernierHash = null;   // ce qu'on vient d'écrire soi-même, pour ne pas le relire en boucle

  function ecrireAdresse() {
    if (SANS_ADRESSE[state.view]) return;
    let h = "#" + state.view;
    if (state.view === "logement" && state.lgtId) h += "/" + state.lgtId;
    if (state.view === "ot-proprio" && state.otId) h += "/" + encodeURIComponent(state.otId);
    if (location.hash === h) return;
    dernierHash = h;
    if (pushOk) {
      try { return void history.pushState(null, "", h); }
      catch (_) { pushOk = false; }   // origine nulle : on se rabat sur le hash
    }
    location.hash = h;
  }

  function lireAdresse() {
    const brut = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    if (!brut) return null;
    const [view, id] = brut.split("/");
    return V[view] && !SANS_ADRESSE[view] ? { view, id } : null;
  }

  function poserAdresse(r) {
    if (r.id) {
      if (r.view === "ot-proprio") state.otId = r.id;
      else state.lgtId = r.id;
    }
  }

  // retour et suivant du navigateur. Les deux événements peuvent arriver pour un seul
  // mouvement : on ne traite qu'un changement d'adresse qu'on n'a pas écrit soi-même.
  function restaurer() {
    if (location.hash === dernierHash) return;
    dernierHash = location.hash;
    const r = lireAdresse();
    if (!r) { state.view = "accueil"; return draw(); }
    poserAdresse(r);
    if (allowed(r.view)) { state.blocked = null; state.view = r.view; }
    else if (state.auth) state.view = "refus";     // bon compte, mauvais rôle
    else { state.blocked = r.view; state.view = "connexion"; }
    draw();
  }

  window.addEventListener("popstate", restaurer);
  window.addEventListener("hashchange", restaurer);

  function go(view, id) {
    if (id) state.lgtId = id;
    // quitter l'écran du second facteur abandonne la connexion en cours
    if (state.view === "mfa" && view !== "mfa" && state.mfa.awaiting) {
      state.mfa = { awaiting: null, code: null, tries: 0 };
      note("Connexion abandonnée", "second facteur non fourni", state.agent.email);
    }
    if (view === "mfa" && !state.mfa.awaiting) view = "connexion";
    if (view !== "avantages") state.billetVu = null;
    if (view === "logement" && !state.lgtId) state.lgtId = state.lgts[0].id;
    if (!allowed(view)) {
      if (state.auth) {                       // connecté, mais mauvais rôle → 403
        state.view = "refus";
        note("Accès refusé", `tentative d'accès à ${view}`);
        draw();
        return toast("Accès refusé : votre compte n'a pas ce rôle.");
      }
      state.blocked = view;                   // pas connecté → 401, on mémorise la destination
      state.view = "connexion";
      draw();
      return toast("Connectez-vous pour accéder à cet espace.");
    }
    state.blocked = null;
    state.view = view;
    draw();
  }

  // un agent de l'office ne passe jamais directement du mot de passe à la file d'attente
  function signIn(as) {
    if (as === "ot") {
      state.mfa = { awaiting: "ot", code: String(Math.floor(100000 + Math.random() * 900000)), tries: 0 };
      state.view = "mfa";
      note("Mot de passe accepté", "second facteur demandé", state.agent.email);
      return draw();
    }
    finishSignIn(as);
  }

  function finishSignIn(as) {
    state.auth = as;
    state.mfa.awaiting = null;
    const back = state.blocked && allowed(state.blocked) ? state.blocked : (as === "ot" ? "ot-file" : "tdb");
    state.blocked = null;
    state.view = back;
    note("Connexion", as === "ot" ? "agent de l'office, second facteur validé" : "propriétaire");
    draw();
  }

  function signOut(quiet) {
    state.auth = null;
    state.blocked = null;
    state.view = "accueil";
    draw();
    if (!quiet) toast("Déconnecté. La session est révoquée côté serveur, pas seulement effacée du navigateur.");
  }

  // --- recherche SIRET : on ne repasse pas par draw(), sinon le champ perd le focus
  let siretTimer = null;
  async function siretRun(q) {
    state.siret.q = q;
    state.siret.selected = null;
    const term = q.trim();
    if (term.length < 3) {
      Object.assign(state.siret, { busy: false, results: [], source: null, reason: null });
      return siretOut();
    }
    state.siret.busy = true;
    siretOut();
    const { source, results, reason } = await siretSearch(term);
    if (state.siret.q !== q) return;               // une frappe plus récente a pris la main
    Object.assign(state.siret, { busy: false, results, source, reason: reason || null });
    siretOut();
  }

  document.addEventListener("change", e => {
    if (e.target.name === "kind") {
      const bloc = document.getElementById("bloc-societe");
      if (bloc) {
        bloc.hidden = e.target.value !== "societe";
        const rs = document.getElementById("s-raison");
        if (rs) rs.required = !bloc.hidden;
      }
    }
  });

  document.addEventListener("input", e => {
    // on ne redessine que le corps du tableau : sinon le champ perd le focus à chaque frappe
    if (e.target.id === "ot-q") {
      state.ot.q = e.target.value;
      const body = document.getElementById("ot-tbody");
      if (body) body.innerHTML = otRows();
      return;
    }
    if (e.target.id === "s-pwd") {
      const m = document.getElementById("s-pwd-meter");
      if (m) m.innerHTML = pwdMeter(e.target.value);
      return;
    }
    if (e.target.id === "s-siret") {
      const box = document.getElementById("s-siret-etat");
      const val = e.target.value.replace(/[\s.]/g, "");
      if (box) box.innerHTML = /^\d{14}$/.test(val)
        ? (siretLuhn(val) ? `<span class="tag t-ok">clé de contrôle valide</span>`
                          : `<span class="tag t-stop">clé de contrôle invalide</span>`)
        : "";
      return;
    }
    if (e.target.id !== "siret-q") return;
    const q = e.target.value;
    state.siret.q = q;
    const box = document.getElementById("siret-luhn");
    if (box) {                                      // indicateur de clé de contrôle, dès 14 chiffres
      box.innerHTML = /^\d{14}$/.test(q.replace(/[\s.]/g, ""))
        ? (siretLuhn(q)
            ? `<span class="tag t-ok">clé de contrôle valide</span>`
            : `<span class="tag t-stop">clé de contrôle invalide</span>`)
        : "";
    }
    clearTimeout(siretTimer);
    siretTimer = setTimeout(() => siretRun(q), 350);
  });


  // --- formulaires : soumission native, donc validation HTML gratuite
  document.addEventListener("submit", e => {
    const f = e.target;
    e.preventDefault();

    if (f.id === "form-login") {
      const mail = document.getElementById("l-mail").value.trim();
      const pwd = document.getElementById("l-pwd").value;
      if (locked()) {                                 // le bon mot de passe est refusé lui aussi
        note("Connexion refusée", `adresse ${mail} · compte verrouillé`);
        toast("Refusé : le compte est verrouillé, le mot de passe n'est même pas vérifié.");
        return draw();
      }
      if (pwd !== PWD_DEMO) {
        state.sec.fails++;
        note("Échec de connexion", `adresse ${mail} · tentative ${state.sec.fails} sur ${MAX_TRIES}`);
        if (state.sec.fails >= MAX_TRIES) {
          state.sec.lockUntil = Date.now() + LOCK_MS;
          note("Compte verrouillé", "quinze minutes, par compte et par adresse IP");
          toast("Cinquième échec. Le compte est verrouillé quinze minutes.");
        }
        saveLock();
        const left = MAX_TRIES - state.sec.fails;
        if (left > 0) toast(`Identifiants refusés. ${left} tentative${left > 1 ? "s" : ""} avant verrouillage.`);
        return draw();
      }
      state.sec.fails = 0;
      state.sec.lockUntil = null;
      saveLock();
      return signIn("owner");
    }

    if (f.id === "form-motif") {
      const r = state.review;
      if (!r) return draw();
      const l = lgt(r.id), doc = l.docs[r.i];
      const choisi = (f.querySelector('input[name="motif"]:checked') || {}).value || "";
      const libre = document.getElementById("motif-libre").value.trim();
      if (!choisi && !libre) {
        toast("Un refus sans motif n'est pas transmissible. Précisez-le.");
        return;
      }
      doc.status = "REJECTED";
      doc.note = choisi && libre ? `${choisi} — ${libre}` : (choisi || libre);
      doc.reviewedBy = state.agent.name;
      doc.reviewedAt = stamp();
      l.status = "REJECTED";
      state.review = null;
      note("Pièce refusée", `${l.id} · ${doc.label} — ${doc.note}`);
      toast("Refusée. Le propriétaire lit le motif, pas seulement le verdict.");
      return draw();
    }

    if (f.id === "form-controle") {
      const code = document.getElementById("c-code").value.trim().toUpperCase();
      const b = billet(code);
      if (!b) {
        state.scan = { verdict: "INCONNU", code };
        note("Billet refusé", `code inconnu présenté au contrôle : ${code || "(vide)"}`);
        toast("Billet inconnu. Entrée refusée.");
      } else if (b.etat === "UTILISE") {
        state.scan = { verdict: "DEJA", code, quand: b.scanneLe, par: b.scannePar };
        note("Billet refusé", `${b.code} · déjà consommé le ${b.scanneLe}`);
        toast("Déjà utilisé. Entrée refusée.");
      } else {
        b.etat = "UTILISE";
        b.scanneLe = stamp();
        b.scannePar = state.agent.name;
        state.scan = { verdict: "OK", code, qui: `${state.owner.firstName} ${state.owner.lastName}`, quoi: droitDe(b.droit).nom };
        note("Billet contrôlé", `${b.code} · ${droitDe(b.droit).nom} · entrée autorisée`);
        toast("Entrée autorisée. Le billet est consommé.");
      }
      return draw();
    }

    if (f.id === "form-oubli") {
      const mail = document.getElementById("o-mail").value.trim();
      state.reset = { sent: true, mail };
      note("Demande de réinitialisation", `adresse ${mail} · réponse identique quel que soit le résultat`);
      toast("Réponse envoyée. La même, quelle que soit l'adresse.");
      return draw();
    }

    if (f.id === "form-mfa") {
      const code = document.getElementById("m-code").value.replace(/\s/g, "");
      if (code === state.mfa.code) return finishSignIn(state.mfa.awaiting || "ot");
      state.mfa.tries++;
      note("Second facteur refusé", `tentative ${state.mfa.tries} sur 3`, state.agent.email);
      if (state.mfa.tries >= 3) {
        state.mfa = { awaiting: null, code: null, tries: 0 };
        state.view = "connexion";
        note("Connexion abandonnée", "trois codes refusés, retour au mot de passe", state.agent.email);
        toast("Trois codes refusés. La connexion repart de zéro.");
        return draw();
      }
      toast("Code refusé.");
      return draw();
    }

    if (f.id === "form-signup") {
      const societe = f.querySelector('input[name="kind"]:checked').value === "societe";
      const v = id => (document.getElementById(id) || {}).value || "";
      state.owner = {
        firstName: v("s-prenom") || "Claire", lastName: v("s-nom") || "Ravanel",
        email: v("s-mail"), phone: v("s-tel"),
        kind: societe ? (v("s-raison") || "Société") : "Particulier",
        town: v("s-ville") || "—"
      };
      state.pending = v("s-mail");
      state.view = "verif";
      note("Compte créé", "en attente de vérification de l'adresse");
      return draw();
    }

    if (f.id === "form-lgt") {
      const v = id => (document.getElementById(id) || {}).value || "";
      const id = "LGT-" + String(state.lgts.length + 1).padStart(3, "0");
      state.lgts.push({
        id, name: v("n-nom"), sector: v("n-secteur"),
        street: v("n-adresse"), beds: +v("n-lits") || 0, area: +v("n-surface") || 0,
        stars: +v("n-classement") || 0, reg: v("n-reg").trim(), status: "DRAFT",
        owners: [{ who: `${state.owner.firstName} ${state.owner.lastName}`, role: "PRIMARY", accepted: true }],
        docs: [
          { label: "Classement meublé de tourisme", file: "", status: "MISSING", until: "" },
          { label: "Attestation d'assurance", file: "", status: "MISSING", until: "" },
          { label: "Diagnostic de performance énergétique", file: "", status: "MISSING", until: "" }
        ]
      });
      note("Logement déclaré", `${id} · ${v("n-nom")}`);
      toast("Dossier créé. Il vous reste les justificatifs à déposer.");
      return go("logement", id);
    }

    if (f.dataset.invite) {
      const l = lgt(f.dataset.invite);
      const mail = f.querySelector('input[type="email"]').value.trim();
      if (!mail) return;
      l.owners.push({ who: mail, role: "CO_OWNER", accepted: false });
      note("Copropriétaire invité", `${l.id} · ${mail}`);
      toast("Invitation envoyée. Le lien est valable 30 jours.");
      return draw();
    }
  });

  // --- le bandeau vit hors de <main> : son propre écouteur, pour ne pas redessiner la vue
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-consent]");
    if (!t) return;
    switch (t.dataset.consent) {
      case "open":     state.consent.open = true;  return paintConsent();
      case "close":    state.consent.open = false; return paintConsent();
      case "reopen":   state.consent.open = true;  paintConsent();
                       return document.querySelector(".consent").scrollIntoView({ block: "nearest" });
      case "accept":   return decide(true);
      case "refuse":   return decide(false);
      case "withdraw": return decide(false);
      case "save":     return decide(document.getElementById("c-audience").checked);
    }
  });

  document.addEventListener("click", e => {
    const s = e.target.closest("[data-siret-ex],[data-siret-pick],[data-siret-back]");
    if (s) {
      const d = s.dataset;
      if (d.siretEx) {
        const input = document.getElementById("siret-q");
        if (input) { input.value = d.siretEx; input.focus(); }
        return siretRun(d.siretEx);
      }
      if (d.siretPick) {
        state.siret.selected = state.siret.results[+d.siretPick];
        return siretOut();
      }
      state.siret.selected = null;
      return siretOut();
    }

    const t = e.target.closest("[data-go],[data-as],[data-login],[data-logout],[data-toast],[data-verify],[data-invite-view],[data-invite-accept],[data-rev],[data-rev-cancel],[data-send],[data-up],[data-reg],[data-cgu],[data-adh],[data-unlock],[data-oubli-test],[data-mfa-fill],[data-otfiche],[data-otfiltre],[data-csv],[data-recette],[data-emettre],[data-annuler],[data-billet],[data-billet-retour],[data-coller-billet]");
    if (!t) return;
    if (t.tagName === "A") e.preventDefault();
    const d = t.dataset;

    if (d.unlock) {
      state.sec = { fails: 0, lockUntil: null };
      saveLock();
      note("Verrou levé", "raccourci de démonstration ; dans le produit, il faut attendre la fin des quinze minutes");
      toast("Verrou levé. Dans le produit, seule l'attente le lève.");
      return draw();
    }
    if (d.oubliTest) {
      const bidon = `inconnu.${Math.floor(Math.random() * 9000 + 1000)}@example.fr`;
      state.reset = { sent: true, mail: bidon };
      note("Demande de réinitialisation", `adresse ${bidon} · aucun compte, réponse identique`);
      toast("Adresse inexistante, réponse identique au caractère près.");
      return draw();
    }
    if (d.mfaFill) {
      const champCode = document.getElementById("m-code");
      if (champCode) { champCode.value = state.mfa.code || ""; champCode.focus(); }
      return;
    }

    if (d.as) return d.as === "none" ? signOut(true) : signIn(d.as);
    if (d.login) return signIn(d.login);
    if (d.logout) return signOut(false);
    if (d.go) return go(d.go, d.id);
    if (d.toast) return toast(d.toast);

    if (d.verify) {                                  // le lien de vérification a été ouvert
      state.pending = null;
      state.auth = "owner";
      state.view = "tdb";
      note("Adresse vérifiée", "compte actif");
      toast("Adresse confirmée. Bienvenue.");
      return draw();
    }
    if (d.inviteView) { state.lgtId = d.inviteView; return go("invitation"); }
    if (d.inviteAccept) {
      const l = lgt(d.inviteAccept);
      const inv = (l.owners || []).find(x => !x.accepted);
      if (inv) { inv.accepted = true; note("Invitation acceptée", `${l.id} · ${inv.who}`); }
      toast("Invitation acceptée. Vous avez accès au dossier.");
      return go("logement", l.id);
    }

    if (d.up) {
      const [id, i] = d.up.split(":");
      const l = lgt(id), doc = l.docs[+i];
      const remplace = doc.status === "REJECTED";
      doc.status = "PENDING";
      doc.file = doc.label.toLowerCase().split(" ")[0].replace(/[^a-z]/g, "") + "-" + l.id.toLowerCase() + ".pdf";
      doc.until = "31/12/2026";
      doc.note = null;                     // le motif tombe avec la pièce qu'il visait
      // un bien redevient instructible dès qu'il ne reste aucune pièce refusée
      if (remplace && !l.docs.some(x => x.status === "REJECTED")) l.status = "SUBMITTED";
      note("Pièce déposée", `${l.id} · ${doc.label}${remplace ? " (remplacement après refus)" : ""}`);
      toast("Pièce déposée. Elle part dans la file de l'office.");
      return draw();
    }

    if (d.reg) {
      const l = lgt(d.reg);
      l.reg = "73176 000 789 1C";
      l.stars = 2;
      note("Bien mis à jour", `${l.id} · numéro d'enregistrement saisi`);
      toast("Numéro d'enregistrement enregistré.");
      return draw();
    }

    if (d.send) {
      const l = lgt(d.send);
      l.status = "SUBMITTED";
      note("Envoi de dossier", `${l.id} transmis pour instruction`);
      toast("Dossier envoyé. Vous recevez un accusé de réception par e-mail.");
      return draw();
    }

    if (d.rev) {
      const [id, i, verdict] = d.rev.split(":");
      const l = lgt(id), doc = l.docs[+i];
      if (verdict === "ok") {
        doc.status = "VALIDATED";
        note("Pièce validée", `${l.id} · ${doc.label}`);
        toast("Validée. Le propriétaire est notifié.");
        if (l.docs.every(x => x.status === "VALIDATED") && l.status === "SUBMITTED") {
          l.status = "VALIDATED";
          note("Bien validé", `${l.id} · dossier complet`);
        }
        state.review = null;
      } else {
        state.review = { id, i: +i };      // le refus passe par la saisie du motif
      }
      return draw();
    }
    if (d.revCancel) { state.review = null; return draw(); }
    // les boutons de l'écran de recette ouvrent la démonstration, en prenant la session qu'il faut
    if (d.recette) {
      const v = d.recette;
      if (v === "refus-essai") {
        if (state.auth !== "owner") finishSignIn("owner");
        return go("ot-file");                      // propriétaire visant l'espace de l'office
      }
      if (v === "mfa" || v === "ot-journal") {
        if (state.auth === "ot") return go(v === "mfa" ? "ot-file" : v);
        if (v === "ot-journal") state.blocked = v;  // on y revient après le second facteur
        return signIn("ot");
      }
      if (v === "logement-nouveau" && state.auth !== "owner") finishSignIn("owner");
      return go(v);
    }
    if (d.emettre) {
      const droit = droitDe(d.emettre);
      if (restants(droit) <= 0) return toast("Quota atteint. Le serveur refuserait, et cet écran aussi.");
      const code = codeBillet(droit.id);
      state.avantages.billets.unshift({ code, droit: droit.id, emisLe: stamp(), etat: "VALIDE", scanneLe: null, scannePar: null });
      state.billetVu = code;
      note("Billet édité", `${droit.nom} · ${code} · ${restants(droit)} entrée(s) restante(s)`);
      toast("Billet édité. Il ne vaut qu'une entrée, et une seule fois.");
      return go("avantages");
    }
    if (d.annuler) {
      const b = billet(d.annuler);
      if (!b || b.etat !== "VALIDE") return toast("Un billet déjà contrôlé ne s'annule pas.");
      state.avantages.billets = state.avantages.billets.filter(x => x.code !== d.annuler);
      state.billetVu = null;
      note("Billet annulé", `${droitDe(b.droit).nom} · ${b.code} · entrée rendue`);
      toast("Billet annulé, l'entrée revient dans votre compte.");
      return go("avantages");
    }
    if (d.billet) { state.billetVu = d.billet; return go("avantages"); }
    if (d.billetRetour) { state.billetVu = null; return go("avantages"); }
    if (d.collerBillet) {
      const champCode = document.getElementById("c-code");
      if (champCode) { champCode.value = d.collerBillet; champCode.focus(); }
      return;
    }
    if (d.otfiche) { state.otId = d.otfiche; return go("ot-proprio"); }
    if (d.otfiltre) { state.ot.filtre = d.otfiltre; return draw(); }
    if (d.csv) return d.csv === "proprios" ? exportProprios() : exportLogements();

    if (d.cgu) {
      state.adhesion.cgu = true;
      state.adhesion.cguAt = stamp();
      note("Conditions acceptées", "version 2026-07-A");
      toast("Conditions acceptées, horodatage conservé.");
      return draw();
    }
    if (d.adh === "send") {
      state.adhesion.status = "SUBMITTED";
      note("Adhésion transmise", `saison ${state.adhesion.season}`);
      toast("Dossier d'adhésion transmis à l'office.");
      return draw();
    }
    if (d.adh === "validate") {
      state.adhesion.status = "VALIDATED";
      note("Adhésion validée", `saison ${state.adhesion.season}`);
      toast("Adhésion validée. L'office appellera la cotisation.");
      return draw();
    }
  });

  // un lien profond vers un espace privé passe par la connexion, puis y revient
  (function amorcer() {
    const r = lireAdresse();
    dernierHash = location.hash;
    if (!r) return;
    poserAdresse(r);
    if (allowed(r.view)) return void (state.view = r.view);
    state.blocked = r.view;
    state.view = "connexion";
  })();

  draw();
})();
</script>
</body>
</html>
